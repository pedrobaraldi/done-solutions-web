<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light only">
  <title>Nova mensagem pelo site</title>
</head>
<body style="margin:0;padding:0;background-color:#eef1f5;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#eef1f5" style="background-color:#eef1f5;">
    <tr>
      <td align="center" style="padding:32px 12px;">

        <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;">

          <tr>
            <td bgcolor="#192a43" style="background-color:#192a43;padding:22px 32px;border-radius:12px 12px 0 0;font-family:Arial,Helvetica,sans-serif;">
              <p style="margin:0;font-size:13px;color:#e2a936;font-weight:bold;">Site Done Solutions</p>
              <h1 style="margin:4px 0 0 0;font-size:22px;line-height:1.3;color:#ffffff;">Nova mensagem recebida</h1>
            </td>
          </tr>
          <tr>
            <td height="4" bgcolor="#e2a936" style="background-color:#e2a936;font-size:0;line-height:0;">&nbsp;</td>
          </tr>

          <tr>
            <td bgcolor="#ffffff" style="background-color:#ffffff;padding:32px;font-family:Arial,Helvetica,sans-serif;color:#1e2430;">

              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td width="110" valign="top" style="padding:8px 0;font-size:14px;color:#667085;">Nome</td>
                  <td valign="top" style="padding:8px 0;font-size:15px;font-weight:bold;color:#1e2430;">{{name}}</td>
                </tr>
                <tr>
                  <td valign="top" style="padding:8px 0;font-size:14px;color:#667085;border-top:1px solid #eef1f5;">E-mail</td>
                  <td valign="top" style="padding:8px 0;font-size:15px;border-top:1px solid #eef1f5;">
                    <a href="mailto:{{email}}" style="color:#192a43;">{{email}}</a>
                  </td>
                </tr>
                <tr>
                  <td valign="top" style="padding:8px 0;font-size:14px;color:#667085;border-top:1px solid #eef1f5;">Telefone</td>
                  <td valign="top" style="padding:8px 0;font-size:15px;color:#1e2430;border-top:1px solid #eef1f5;">{{phone}}</td>
                </tr>
              </table>

              <p style="margin:24px 0 8px 0;font-size:14px;color:#667085;">Mensagem</p>
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td bgcolor="#f5f7fa" style="background-color:#f5f7fa;border-left:4px solid #e2a936;border-radius:4px;padding:16px 18px;font-size:15px;line-height:1.6;color:#1e2430;white-space:pre-wrap;">{{message}}</td>
                </tr>
              </table>

              <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin-top:28px;">
                <tr>
                  <td align="center" bgcolor="#e2a936" style="background-color:#e2a936;border-radius:8px;">
                    <a href="mailto:{{email}}?subject=Re:%20Contato%20Done%20Solutions" style="display:inline-block;padding:13px 26px;font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:bold;color:#192a43;text-decoration:none;">
                      Responder {{name}}
                    </a>
                  </td>
                </tr>
              </table>

            </td>
          </tr>

          <tr>
            <td align="center" bgcolor="#f5f7fa" style="background-color:#f5f7fa;padding:18px 32px;border-radius:0 0 12px 12px;border-top:1px solid #e3e8ef;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.6;color:#8f9bb0;">
              Mensagem enviada pelo formulário de contato do site e também guardada no Firebase.
            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>
</body>
</html>
